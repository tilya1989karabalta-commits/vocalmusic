<!DOCTYPE html>
<html lang="ky">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Эсеп-кысап (Смета)</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 10px;
            color: #333;
        }
        .container {
            background-color: white;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            max-width: 600px;
            margin: 0 auto;
        }
        h2 {
            margin-bottom: 5px;
            font-size: 18px;
        }
        .header-info {
            font-size: 12px;
            color: #666;
            border-bottom: 2px solid #0056b3;
            padding-bottom: 5px;
            margin-bottom: 15px;
        }
        .client-info {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            margin-bottom: 15px;
            background: #f9f9f9;
            padding: 10px;
            border-radius: 5px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 15px;
            font-size: 13px;
        }
        th, td {
            border-bottom: 1px solid #ddd;
            padding: 8px 4px;
            text-align: left;
        }
        th {
            color: #0056b3;
            font-weight: bold;
        }
        .total {
            text-align: right;
            font-weight: bold;
            font-size: 16px;
            color: #0056b3;
            margin-top: 10px;
        }
        .form-group {
            margin-bottom: 10px;
        }
        input[type="text"], input[type="number"] {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 14px;
        }
        .btn-add {
            background-color: #0056b3;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 5px;
            font-size: 14px;
            cursor: pointer;
            width: 100%;
            margin-top: 5px;
        }
        .btn-del {
            background-color: #ff4d4d;
            color: white;
            border: none;
            padding: 5px;
            border-radius: 3px;
            cursor: pointer;
            font-size: 12px;
        }
        .hidden {
            display: none;
        }
        .controls {
            border-top: 1px dashed #ccc;
            padding-top: 15px;
            margin-top: 15px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Эсеп-кысап (смета)</h2>
    <div class="header-info">Кара-Балта ш., Садовая көчөсү 113 • 0556-652-652, 0559-656-657</div>

    <div class="client-info">
        <div>
            <strong>Кардардын аты:</strong><br>
            <input type="text" id="clientName" value="Нурсултан" style="margin-top: 5px;">
        </div>
        <div style="text-align: right;">
            <strong>Дата:</strong> <span id="dateDisplay"></span><br>
            <strong>Арзандатуу, %:</strong><br>
            <input type="number" id="discount" value="0" min="0" max="100" style="width: 60px; margin-top: 5px; text-align: right;">
        </div>
    </div>

    <table>
        <thead>
            <tr>
                <th>№</th>
                <th>Товар</th>
                <th>Саны</th>
                <th>Бирдик</th>
                <th>Баасы</th>
                <th>Сумма</th>
                <th></th>
            </tr>
        </thead>
        <tbody id="productList">
            <!-- Товарлар бул жерге кошулат -->
        </tbody>
    </table>

    <div class="total">
        Жалпы сумма: <span id="grandTotal">0</span> сом
    </div>

    <div class="controls">
        <h3 style="font-size: 15px; margin-bottom: 10px;">Товар кошуу</h3>
        <div class="form-group">
            <input type="text" id="itemName" placeholder="Товардын аталышы (мис: Теневой багет ПВХ)">
        </div>
        <div class="form-group" style="display: flex; gap: 10px;">
            <input type="number" id="itemQty" placeholder="Саны" value="1" style="width: 30%;">
            <input type="text" id="itemUnit" placeholder="Бирдик (м, шт)" value="м" style="width: 30%;">
            <input type="number" id="itemPrice" placeholder="Баасы" style="width: 40%;">
        </div>
        <button class="btn-add" onclick="addItem()">Кошуу</button>
    </div>
</div>

<script>
    // Бүгүнкү датаны алуу
    const today = new Date();
    const formattedDate = today.getDate().toString().padStart(2, '0') + '.' + 
                          (today.getMonth() + 1).toString().padStart(2, '0') + '.' + 
                          today.getFullYear();
    document.getElementById('dateDisplay').innerText = formattedDate;

    let items = [
        { name: "Теневой багет ПВХ", qty: 10, unit: "м", price: 65 },
        { name: "Световые линии 3см", qty: 2, unit: "м", price: 320 }
    ];

    // Товарларды экранга чыгаруу жана эсептөө
    function renderItems() {
        const tbody = document.getElementById('productList');
        tbody.innerHTML = '';
        let totalSum = 0;

        items.forEach((item, index) => {
            let itemTotal = item.qty * item.price;
            totalSum += itemTotal;

            let tr = document.createElement('tr');
            tr.innerHTML = `
                <td>${index + 1}</td>
                <td>${item.name}</td>
                <td>${item.qty}</td>
                <td>${item.unit}</td>
                <td>${item.price}</td>
                <td>${itemTotal}</td>
                <td><button class="btn-del" onclick="removeItem(${index})">X</button></td>
            `;
            tbody.appendChild(tr);
        });

        // Арзандатууну эсептөө
        const discountPercent = parseFloat(document.getElementById('discount').value) || 0;
        const discountAmount = totalSum * (discountPercent / 100);
        const grandTotal = totalSum - discountAmount;

        document.getElementById('grandTotal').innerText = grandTotal;
    }

    // Жаңы товар кошуу
    function addItem() {
        const name = document.getElementById('itemName').value;
        const qty = parseFloat(document.getElementById('itemQty').value);
        const unit = document.getElementById('itemUnit').value;
        const price = parseFloat(document.getElementById('itemPrice').value);

        if (name && qty > 0 && price >= 0) {
            items.push({ name, qty, unit, price });
            
            // Форманы тазалоо
            document.getElementById('itemName').value = '';
            document.getElementById('itemQty').value = '1';
            document.getElementById('itemPrice').value = '';
            
            renderItems();
        } else {
            alert("Сураныч, маалыматтарды толук жана туура киргизиңиз!");
        }
    }

    // Товарды өчүрүү
    function removeItem(index) {
        items.splice(index, 1);
        renderItems();
    }

    // Арзандатуу өзгөргөндө кайра эсептөө
    document.getElementById('discount').addEventListener('input', renderItems);

    // Алгачкы жолу иштетүү
    renderItems();
</script>

</body>
</html>
